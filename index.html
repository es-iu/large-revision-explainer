<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Large Revision Workflow — Now / Future</title>
<style>
:root {
  --bg:#060f2c;
  --panel:#0e1a37;
  --panel-2:#0b1430;
  --line:#274579;
  --line-soft:#23406f;
  --text:#eef3ff;
  --muted:#9ca9c4;
  --blue:#2f77ff;
  --blue-2:#5e9bff;
  --purple:#8565f3;
  --green:#31c36a;
  --grey:#4a5777;
  --gold:#f3b347;
  --gold-2:#ffd98f;
  --gold-bg:#f5e5bf;
  --gold-bg-2:#f1dfb1;
  --gold-line:#e3b04f;
  --shadow:0 14px 34px rgba(0,0,0,.25);
  --radius:18px;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
body { overflow:hidden; color-scheme:dark; }
button { font:inherit; }
.app { height:100vh; display:grid; grid-template-rows:auto 1fr; overflow:hidden; }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:24px 28px 10px; }
.title { font-size:24px; font-weight:800; letter-spacing:.01em; }
.mode-toggle { display:inline-flex; background:#0b1430; border:1px solid var(--line-soft); padding:4px; border-radius:999px; box-shadow:var(--shadow); }
.mode-toggle button { border:0; background:transparent; color:var(--muted); padding:9px 18px; border-radius:999px; font-weight:800; cursor:pointer; transition:color .4s cubic-bezier(.22,.61,.36,1), background .5s cubic-bezier(.22,.61,.36,1), box-shadow .5s cubic-bezier(.22,.61,.36,1), transform .35s cubic-bezier(.22,.61,.36,1); }
.mode-toggle button.active { background:linear-gradient(180deg,#172944 0%,#13203b 100%); color:var(--text); box-shadow:0 0 0 1px rgba(255,255,255,.05) inset; }
main { min-height:0; padding:0 28px 22px; overflow:hidden; }
.shell { height:100%; display:grid; grid-template-rows:1fr 0fr; gap:0; overflow:hidden; transition:grid-template-rows 1250ms cubic-bezier(.22,.61,.36,1), gap 800ms cubic-bezier(.22,.61,.36,1); }
.shell.compact { grid-template-rows:180px minmax(0,1fr); gap:8px; }
.shell.overview .panel { display:none; }
.workflow { position:relative; height:100%; overflow:visible; isolation:isolate; z-index:3; }
.shell.overview .workflow { min-height:560px; }
.workflow-lines { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:0; }
.workflow-lines { opacity:1; }
.workflow-lines path { will-change:stroke-dashoffset; }
.workflow-lines path { fill:none; stroke:#2b4f8f; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; opacity:.9; }
.workflow-lines .workflow-drop { stroke:var(--blue-2); opacity:.85; }
.stage-tab { will-change:transform, opacity; position:absolute; z-index:2; width:150px; height:106px; padding:12px 14px 10px; border:1.5px solid var(--line-soft); border-radius:38px; background:linear-gradient(180deg,#1f3258 0%, #12203c 100%); box-shadow:0 10px 28px rgba(0,0,0,.22); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; transition:border-color .55s cubic-bezier(.22,.61,.36,1), background .55s cubic-bezier(.22,.61,.36,1), transform .45s cubic-bezier(.22,.61,.36,1), box-shadow .55s cubic-bezier(.22,.61,.36,1), width 1250ms cubic-bezier(.22,.61,.36,1), height 1250ms cubic-bezier(.22,.61,.36,1), padding 1250ms cubic-bezier(.22,.61,.36,1), border-radius 1250ms cubic-bezier(.22,.61,.36,1), left 1250ms cubic-bezier(.22,.61,.36,1), top 1250ms cubic-bezier(.22,.61,.36,1); user-select:none; }
.workflow.reflowing .stage-tab { transition:border-color .55s cubic-bezier(.22,.61,.36,1), background .55s cubic-bezier(.22,.61,.36,1), box-shadow .55s cubic-bezier(.22,.61,.36,1) !important; }
.shell.compact .stage-tab { width:128px; height:88px; padding:10px 10px 8px; border-radius:30px; }
.shell.compact .stage-tab .status-pill { top:-6px; right:12px; padding:4px 8px; }
.shell.compact .stage-tab .num { width:32px; height:32px; margin-bottom:7px; font-size:13px; }
.shell.compact .stage-tab h3 { font-size:12px; }
.stage-tab:hover { transform:translateY(-1px) scale(1.006); border-color:#5a84cb; box-shadow:0 14px 32px rgba(0,0,0,.24); }
.stage-tab.active { border-width:3px; box-shadow:0 16px 38px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.04) inset; }
.stage-tab.future-change { border-color:rgba(243,179,71,.7); }
.stage-tab .status-pill { position:absolute; top:-12px; right:16px; padding:5px 10px; border-radius:999px; font-size:10px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; background:var(--gold); color:#473109; box-shadow:0 8px 16px rgba(228,156,31,.3); }
.stage-tab .num { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:900; margin:0 0 9px; color:#eef3ff; box-shadow:0 5px 12px rgba(0,0,0,.18); }
.stage-tab .num, .stage-tab h3, .stage-tab .status-pill { transition:transform .5s cubic-bezier(.22,.61,.36,1), opacity .45s cubic-bezier(.22,.61,.36,1), background .45s cubic-bezier(.22,.61,.36,1); }
.stage-tab h3 { margin:0; font-size:15px; line-height:1.18; max-width:100%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.stage-tab.theme-start .num { background:var(--grey); }
.stage-tab.theme-revise .num, .stage-tab.theme-kfk .num { background:var(--blue); }
.stage-tab.theme-formal .num, .stage-tab.theme-compliance .num { background:var(--purple); }
.stage-tab.theme-publish .num, .stage-tab.theme-video .num { background:var(--green); }
.stage-tab.theme-planning .num { background:var(--gold); color:#473109; }
.stage-tab.theme-start.active, .stage-tab.theme-revise.active, .stage-tab.theme-kfk.active { border-color:var(--blue); }
.stage-tab.theme-formal.active, .stage-tab.theme-compliance.active { border-color:var(--purple); }
.stage-tab.theme-publish.active, .stage-tab.theme-video.active { border-color:var(--green); }
.stage-tab.theme-planning.active { border-color:var(--gold); }
.panel { position:relative; z-index:1; transform-origin:top center; min-height:0; margin:0 18px 0 84px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; overflow:auto; }
.panel:before { content:""; position:absolute; left:-1px; top:-1px; width:84px; height:2px; background:linear-gradient(90deg,var(--blue),transparent); }
.panel-view { min-height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); gap:14px; }
.panel-header { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
.panel-eyebrow { font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:#8da3d3; margin-bottom:6px; }
.panel-heading h2 { margin:0 0 5px; font-size:24px; line-height:1.1; }
.panel-heading p { margin:0; color:var(--muted); font-size:14px; line-height:1.4; }
.panel-status { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.badge { padding:8px 12px; border-radius:999px; background:#17284d; border:1px solid #294a81; font-size:11px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; color:#c8d8ff; }
.badge.future { background:rgba(243,179,71,.12); border-color:rgba(243,179,71,.56); color:var(--gold-2); }
.stage-layout { min-height:0; display:grid; grid-template-columns:minmax(0,1.62fr) minmax(290px,.58fr); gap:12px; align-items:start; }
.stage-layout.no-notes { grid-template-columns:1fr; }
.media-grid { display:grid; gap:12px; align-content:start; }
.media-grid.single { grid-template-columns:1fr; }
.media-grid.double { grid-template-columns:repeat(2,minmax(0,1fr)); }
.media-grid.triple { grid-template-columns:repeat(3,minmax(0,1fr)); }
.shot-card { margin:0; border:1px solid #1f3c70; border-radius:16px; background:var(--panel-2); overflow:hidden; min-height:260px; display:flex; align-items:center; justify-content:center; position:relative; }
.media-grid.single .shot-card { min-height:540px; }
.media-grid.double .shot-card { min-height:420px; }
.media-grid.triple .shot-card { min-height:300px; }
.shot-card.image-card { cursor:zoom-in; padding:8px; }
.shot-card img { display:block; width:100%; height:100%; object-fit:contain; background:var(--panel-2); border-radius:10px; }
.shot-card.placeholder { padding:0; background:linear-gradient(180deg,#101a2e 0%,#0c1530 100%); }
.placeholder-box { display:flex; flex-direction:column; justify-content:space-between; gap:14px; padding:18px; height:100%; width:100%; }
.placeholder-box h4 { margin:0; font-size:20px; line-height:1.15; }
.placeholder-box p { margin:0; color:var(--muted); font-size:14px; line-height:1.5; }
.inline-chips { display:flex; flex-wrap:wrap; gap:7px; }
.inline-chip { padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); font-size:11px; font-weight:700; color:#d5def0; }

.mockup-action { margin-top:14px; display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
.mockup-btn { border:1px solid rgba(94,155,255,.65); background:rgba(47,119,255,.10); color:#dbe8ff; border-radius:999px; padding:8px 12px; font-size:12px; font-weight:800; cursor:pointer; transition:background .28s cubic-bezier(.22,.61,.36,1), border-color .28s cubic-bezier(.22,.61,.36,1), transform .28s cubic-bezier(.22,.61,.36,1); }
.mockup-btn:hover { background:rgba(47,119,255,.18); border-color:var(--blue-2); transform:translateY(-1px); }
.mockup-btn:active { transform:translateY(0) scale(.99); }
.mockup-hint { color:#8fa2c7; font-size:11px; line-height:1.35; }
.panel-demo { margin-top:10px; }

.notes-col { display:flex; flex-direction:column; gap:12px; justify-content:flex-start; min-height:0; overflow:visible; padding-right:2px; }
.sticky { position:relative; color:#293141; border-radius:14px; padding:14px 14px 14px 16px; box-shadow:0 10px 22px rgba(0,0,0,.18); overflow:hidden; }
.sticky.current { background:linear-gradient(180deg,#efe7ff,#e5d7ff); border:1px solid #9d7aea; }
.sticky.prism { background:linear-gradient(180deg,#e6efff,#d7e6ff); border:1px solid #5f8ff7; }
.sticky.future { background:linear-gradient(180deg,var(--gold-bg),var(--gold-bg-2)); border:1px solid var(--gold-line); }
.sticky.future-alt { background:linear-gradient(180deg,#fff0d0,#ffe2a1); border:1px solid #d09222; }
.sticky:before { content:""; position:absolute; right:10px; top:0; width:26px; height:26px; background:linear-gradient(135deg, rgba(255,255,255,.65), rgba(255,255,255,0)); clip-path:polygon(100% 0,0 0,100% 100%); opacity:.7; }
.sticky:after { content:""; position:absolute; top:10px; right:14px; width:9px; height:9px; border-radius:50%; background:#ff7c66; box-shadow:0 0 0 3px rgba(255,255,255,.28); }
.sticky.future:after, .sticky.future-alt:after { background:var(--gold); box-shadow:0 0 0 3px rgba(255,255,255,.36); }
.sticky h4 { margin:0 0 8px; font-size:14px; line-height:1.2; color:#1d2430; }
.sticky p { margin:0; font-size:13px; line-height:1.48; color:#293141; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip { background:rgba(34,50,82,.11); border:1px solid rgba(34,50,82,.18); border-radius:999px; padding:5px 9px; font-size:11px; font-weight:700; color:#24304a; }
.sticky.future .chip, .sticky.future-alt .chip { background:rgba(255,255,255,.35); border-color:rgba(136,93,14,.16); color:#5f420f; }
.mode-toggle button:hover { color:var(--text); }
.mode-toggle button:active { transform:scale(.985); }
.shot-card.image-card { transition:transform .45s cubic-bezier(.22,.61,.36,1), border-color .4s cubic-bezier(.22,.61,.36,1), box-shadow .45s cubic-bezier(.22,.61,.36,1); }
.shot-card.image-card:hover { transform:translateY(-1px); border-color:#3d67ad; box-shadow:0 12px 24px rgba(0,0,0,.16); }
.sticky, .placeholder { transition:transform .45s cubic-bezier(.22,.61,.36,1), box-shadow .45s cubic-bezier(.22,.61,.36,1); }
.sticky:hover, .placeholder:hover { transform:translateY(-1px); box-shadow:0 13px 25px rgba(0,0,0,.18); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } }
.lightbox { position:fixed; inset:0; background:rgba(7,11,20,.92); display:none; align-items:center; justify-content:center; padding:24px; z-index:1000; }
.lightbox.open { display:flex; }
.lightbox img { max-width:95vw; max-height:92vh; border-radius:12px; box-shadow:0 30px 80px rgba(0,0,0,.55); }
.lightbox button { position:absolute; border:0; cursor:pointer; }
.lightbox .close { top:18px; right:18px; width:42px; height:42px; border-radius:999px; background:#fff; color:#111; font-size:24px; }
.lightbox .nav { top:50%; transform:translateY(-50%); width:42px; height:64px; border-radius:12px; background:rgba(255,255,255,.12); color:#fff; font-size:32px; line-height:1; backdrop-filter:blur(6px); opacity:.78; }
.lightbox .nav:hover { background:rgba(255,255,255,.2); opacity:1; }
.lightbox .prev { left:18px; }
.lightbox .next { right:18px; }
.lightbox .nav[hidden] { display:none; }
@media (max-width: 1500px) {
  .shell.compact { grid-template-rows:172px minmax(0,1fr); }
  .stage-tab { width:142px; height:102px; }
  .panel { margin-left:72px; }
  .media-grid.single .shot-card { min-height:500px; }
  .media-grid.double .shot-card { min-height:380px; }
}
@media (max-width: 1200px) {
  html,body { overflow:auto; }
  .app { height:auto; min-height:100vh; }
  main { overflow:visible; }
  .toolbar { padding:20px 18px 10px; }
  .shell { display:block; overflow:visible; height:auto; }
  .workflow { height:auto; display:flex; gap:10px; overflow-x:auto; overflow-y:hidden; padding:10px 0 16px; scroll-snap-type:x proximity; }
  .workflow-lines { display:none; }
  .stage-tab { position:relative !important; left:auto !important; right:auto !important; top:auto !important; flex:0 0 148px; width:148px; height:108px; scroll-snap-align:start; }
  .panel { margin:0; min-height:520px; overflow:visible; }
  .stage-layout { grid-template-columns:1fr; }
  .media-grid.double, .media-grid.triple { grid-template-columns:1fr; }
  .media-grid.single .shot-card, .media-grid.double .shot-card, .media-grid.triple .shot-card { min-height:320px; }
}
</style>
</head>

<div class="app">

</div>

function trackWorkflowGeometry(duration=MOTION.shell, includeDrop=false) {
  const start = performance.now();

    function tick(now) {

      setWorkflowGeometry({route:true, drop:includeDrop});
      if (now - start < duration) requestAnimationFrame(tick);
      else {
        setWorkflowGeometry({route:true, drop:includeDrop});
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

function layoutTabs() {
  if (window.matchMedia('(max-width: 1200px)').matches) return;
  const tabs = [...workflow.querySelectorAll('.stage-tab')];
  const rect = workflow.getBoundingClientRect();
  if (!tabs.length || !rect.width) return;
  const count = tabs.length;
  const isCompact = shell.classList.contains('compact');
  const isOverview = shell.classList.contains('overview');
  const start = isCompact ? 76 : 86;
  const end = rect.width - (isCompact ? 76 : 86);
  const step = count > 1 ? (end - start) / (count - 1) : 0;
  const topY = isOverview ? Math.max(30, (rect.height * 0.5) - 150) : (isCompact ? 12 : 18);
  const lowY = isOverview ? topY + 140 : (isCompact ? 86 : 146);
  const targetW = isCompact ? 128 : 150;
  tabs.forEach((tab, i) => {
    const x = start + step * i;
    const y = (i % 2 === 0) ? topY : lowY;
    tab.style.left = `${Math.max(8, x - targetW/2)}px`;
    tab.style.top = `${y}px`;
  });
}

function computeRouteD() {
  const tabs = [...workflow.querySelectorAll('.stage-tab')];
  const wrap = workflow.getBoundingClientRect();
  if (!wrap.width || !wrap.height || !tabs.length) return '';
  const points = tabs.map(tab => {
    const r = tab.getBoundingClientRect();
    return { x:r.left-wrap.left+r.width/2, y:r.top-wrap.top+r.height/2, w:r.width, h:r.height };
  });
  let d = '';
  for (let i=1; i<points.length; i++) {
    const a=points[i-1], b=points[i];
    const dir = b.x >= a.x ? 1 : -1;
    const ax = a.x + dir * (a.w/2 - 5);
    const bx = b.x - dir * (b.w/2 - 5);
    const dx = bx - ax;
    const bend = dx * .46;
    d += `${d ? ' ' : ''}M ${ax} ${a.y} C ${ax+bend} ${a.y}, ${bx-bend} ${b.y}, ${bx} ${b.y}`;
  }
  return d;
}

function computeDropD() {
  const active = workflow.querySelector('.stage-tab.active');
  const wrap = workflow.getBoundingClientRect();
  if (!active || !wrap.width || !wrap.height) return '';
  const r = active.getBoundingClientRect();
  const x = r.left-wrap.left+r.width/2;
  const y = r.top-wrap.top+r.height;
  return `M ${x} ${y+1} L ${x} ${wrap.height-2}`;
}

function setWorkflowGeometry({route=true, drop=true}={}) {
  const svg = workflow.querySelector('.workflow-lines');
  if (!svg || window.matchMedia('(max-width: 1200px)').matches) return;
  const wrap = workflow.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${wrap.width} ${wrap.height}`);
  if (route) svg.querySelector('.workflow-route').setAttribute('d', computeRouteD());
  if (drop) svg.querySelector('.workflow-drop').setAttribute('d', computeDropD());
}

function captureTabRects() {
  const map = new Map();
  map.ordered = [];
  workflow.querySelectorAll('.stage-tab').forEach(tab => {
    const rect = tab.getBoundingClientRect();
    map.set(tab.dataset.stageId, rect);
    map.ordered.push(rect);
  });
  return map;
}

function animateTabReflow(previousRects, duration=MOTION.move) {
  const animations = [];
  const tabs = [...workflow.querySelectorAll('.stage-tab')];
  const commonRects = tabs
    .map(tab => ({ tab, rect: previousRects.get(tab.dataset.stageId) }))
    .filter(x => x.rect);

  tabs.forEach((tab, index) => {
    const after = tab.getBoundingClientRect();
    let before = previousRects.get(tab.dataset.stageId);

    if (!before && commonRects.length) {
      // Future-only nodes emerge gently from the closest surviving node instead of
      // borrowing an unrelated array index (which caused a mid-flight snap).
      const targetCx = after.left + after.width / 2;
      const nearest = commonRects.reduce((best, item) => {
        const cx = item.rect.left + item.rect.width / 2;
        const dist = Math.abs(cx - targetCx);
        return !best || dist < best.dist ? { rect:item.rect, dist } : best;
      }, null);
      before = nearest?.rect;
    }

    if (!before) {
      animations.push(tab.animate([
        { opacity:0, transform:'translateY(4px)' },
        { opacity:1, transform:'translateY(0)' }
      ], { duration, easing:MOTION.ease, fill:'both' }));
      return;
    }

    const beforeCx = before.left + before.width / 2;
    const beforeCy = before.top + before.height / 2;
    const afterCx = after.left + after.width / 2;
    const afterCy = after.top + after.height / 2;
    const dx = beforeCx - afterCx;
    const dy = beforeCy - afterCy;

    animations.push(tab.animate([
      { transform:`translate(${dx}px, ${dy}px)`, opacity: previousRects.get(tab.dataset.stageId) ? 1 : 0 },
      { transform:'translate(0,0)', opacity:1 }
    ], { duration, easing:'cubic-bezier(.20,.70,.20,1)', fill:'both' }));
  });
  return Promise.all(animations.map(a => a.finished.catch(()=>{})));
}

function animatePathD(path, fromD, toD, duration=MOTION.move) {
  if (!path || !fromD || !toD || fromD === toD) {
    if (path && toD) path.setAttribute('d', toD);
    return Promise.resolve();
  }
  path.setAttribute('d', fromD);
  const anim = document.createElementNS('http://www.w3.org/2000/svg','animate');
  anim.setAttribute('attributeName','d');
  anim.setAttribute('from', fromD);
  anim.setAttribute('to', toD);
  anim.setAttribute('dur', `${duration}ms`);
  anim.setAttribute('fill','freeze');
  anim.setAttribute('calcMode','spline');
  anim.setAttribute('keyTimes','0;1');
  anim.setAttribute('keySplines','.22 .72 .22 1');
  path.appendChild(anim);
  try { anim.beginElement(); } catch(e) {}
  return sleep(duration).then(() => {
    path.setAttribute('d', toD);
    anim.remove();
  });
}

function animateStroke(path, direction='draw', duration=MOTION.redraw) {
  if (!path || !path.getAttribute('d')) return Promise.resolve();
  let len = 0;
  try { len = path.getTotalLength(); } catch(e) { return Promise.resolve(); }
  if (!len) return Promise.resolve();
  path.getAnimations().forEach(a => a.cancel());
  path.style.strokeDasharray = `${len}`;
  const from = direction === 'draw' ? len : 0;
  const to = direction === 'draw' ? 0 : len;
  path.style.strokeDashoffset = `${from}`;
  const anim = path.animate(
    [{ strokeDashoffset:`${from}` }, { strokeDashoffset:`${to}` }],
    { duration, easing:MOTION.ease, fill:'forwards' }
  );
  return anim.finished.catch(()=>{}).then(() => {
    if (direction === 'draw') {
      path.style.strokeDasharray = '';
      path.style.strokeDashoffset = '';
    } else {
      path.style.strokeDasharray = `${len}`;
      path.style.strokeDashoffset = `${len}`;
    }
  });
}

function clearStrokeState(path) {
  if (!path) return;
  path.getAnimations().forEach(a => a.cancel());
  path.style.strokeDasharray = '';
  path.style.strokeDashoffset = '';
}

function revealPanel() {

async function openDetail(stageId) {
  if (animationLock) return;
  animationLock = true;
  const route = workflow.querySelector('.workflow-route');
  const drop = workflow.querySelector('.workflow-drop');

  currentStageId = stageId;
  compactTimeline = true;
  localStorage.setItem('prismWorkflowStage_' + currentMode, currentStageId);

  // Keep the existing timeline DOM so its boxes can physically glide into place.
  updateWorkflowStateClasses();
  renderPanel();
  panelHost.style.opacity = '0';
  panelHost.style.transform = 'translateY(10px) scale(.996)';
  panelHost.style.filter = 'blur(1.5px)';
  clearStrokeState(route);
  clearStrokeState(drop);
  drop.setAttribute('d','');

  // Commit the compact target positions in the same turn as the shell change so
  // boxes and route start moving together without a one-frame jump.
  layoutTabs();
  await nextFrame();
  await trackWorkflowGeometry(MOTION.shell, false);

  // Once settled, draw the vertical connector and reveal the panel.
  drop.setAttribute('d', computeDropD());
  clearStrokeState(drop);
  await Promise.all([
    animateStroke(drop, 'draw', MOTION.drop),
    revealPanel()
  ]);
  animationLock = false;
}

async function switchDetail(stageId) {
  if (animationLock) return;
  animationLock = true;

  currentStageId = stageId;
  localStorage.setItem('prismWorkflowStage_' + currentMode, currentStageId);
  updateWorkflowStateClasses();
  renderPanel();

  // Detail is already open: do not stage another reveal. Update the selection,
  // connector and content as one immediate state change.
  panelHost.style.opacity = '1';
  panelHost.style.transform = '';
  panelHost.style.filter = '';
  await nextFrame();
  const drop = workflow.querySelector('.workflow-drop');
  clearStrokeState(drop);
  setWorkflowGeometry({route:true, drop:true});
  animationLock = false;
}

async function returnToOverview() {
  if (animationLock || !currentStageId) return;
  animationLock = true;
  const route = workflow.querySelector('.workflow-route');
  const drop = workflow.querySelector('.workflow-drop');

  await Promise.all([
    animateStroke(drop, 'erase', MOTION.panelOut),
    hidePanel()
  ]);

  currentStageId = null;
  compactTimeline = false;
  localStorage.removeItem('prismWorkflowStage_' + currentMode);
  updateWorkflowStateClasses();
  renderPanel();
  clearStrokeState(route);
  drop.setAttribute('d','');
  await nextFrame();
  layoutTabs();
  await trackWorkflowGeometry(MOTION.shell, false);
  animationLock = false;
}

async function changeMode(nextMode) {
  if (animationLock || nextMode === currentMode) return;
  animationLock = true;
  const route = workflow.querySelector('.workflow-route');
  const drop = workflow.querySelector('.workflow-drop');

  // 1) Calmly erase the current connectors.
  const erasures = [];
  if (drop.getAttribute('d')) erasures.push(animateStroke(drop, 'erase', MOTION.erase));
  if (route.getAttribute('d')) erasures.push(animateStroke(route, 'erase', MOTION.erase));
  if (currentStageId) erasures.push(hidePanel());
  await Promise.all(erasures);

  // 2) Recompose the boxes slowly and smoothly into the target mode.
  const previousRects = captureTabRects();
  currentMode = nextMode;
  currentStageId = null;
  compactTimeline = false;
  localStorage.setItem('prismWorkflowMode', currentMode);
  modeButtons.forEach(btn => {
    const active = btn.dataset.mode === currentMode;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  workflow.classList.add('reflowing');
  renderWorkflow();
  renderPanel();
  route.setAttribute('d','');
  drop.setAttribute('d','');
  await nextFrame();
  await animateTabReflow(previousRects, MOTION.move);
  workflow.classList.remove('reflowing');

  // 3) Redraw at the same measured pace used for erasing.
  setWorkflowGeometry({route:true, drop:false});
  clearStrokeState(route);
  await animateStroke(route, 'draw', MOTION.redraw);
  animationLock = false;
}

function handleStageClick(stageId) {
  if (animationLock) return;
  if (!currentStageId) return openDetail(stageId);
  if (currentStageId === stageId) return returnToOverview();
  return switchDetail(stageId);
}

async function renderInitial() {
  modeButtons.forEach(btn => {
    const active = btn.dataset.mode === currentMode;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  renderWorkflow();
  renderPanel();
  await nextFrame();
  setWorkflowGeometry({route:true, drop:true});
  const route = workflow.querySelector('.workflow-route');
  const drop = workflow.querySelector('.workflow-drop');
  clearStrokeState(route);
  clearStrokeState(drop);
}

modeButtons.forEach(btn => btn.addEventListener('click', () => changeMode(btn.dataset.mode)));

function openLightbox(card) { const mediaGrid = card.closest('.media-grid'); lightboxItems = [...mediaGrid.querySelectorAll('.shot-card[data-full]')]; lightboxIndex = Math.max(0, lightboxItems.indexOf(card)); renderLightbox(); const lb = document.getElementById('lightbox'); lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); }
function renderLightbox() { if (!lightboxItems.length) return; const card = lightboxItems[lightboxIndex]; const img = document.getElementById('lbImg'); img.src = card.dataset.full; img.alt = card.dataset.caption || ''; const multi = lightboxItems.length > 1; document.getElementById('lbPrev').hidden = !multi; document.getElementById('lbNext').hidden = !multi; }
function moveLightbox(delta) { if (lightboxItems.length < 2) return; lightboxIndex = (lightboxIndex + delta + lightboxItems.length) % lightboxItems.length; renderLightbox(); }
function closeLb() { const lb = document.getElementById('lightbox'); lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); document.getElementById('lbImg').src = ''; lightboxItems = []; }

document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); moveLightbox(-1); });
document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); moveLightbox(1); });
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLb(); });
document.addEventListener('keydown', e => { const lbOpen = document.getElementById('lightbox').classList.contains('open'); if (!lbOpen) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') moveLightbox(-1); if (e.key === 'ArrowRight') moveLightbox(1); });
document.getElementById('workflowTitle').addEventListener('click', () => returnToOverview());
window.addEventListener('resize', () => requestAnimationFrame(() => requestAnimationFrame(() => setWorkflowGeometry({route:true, drop:true}))));
renderInitial();
</script>
</body>
