<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Flagging Flow</title>
<style>
/* Layout concept: reskinned to the real AI Media Self Service Portal chrome (black hairline,
   white header, grey canvas, duotone course cards) with new flag/status affordances layered on top. */
:root{
  --bg:#e9ebef; --surface:#ffffff; --surface-2:#f3f4f7; --border:#d7dbe3;
  --ink:#14161a; --muted:#5c6270; --accent:#2f5fe0; --accent-fg:#ffffff;
  --good:#1a7a4c; --good-bg:#e2f5ea; --mod:#8a6c05; --mod-bg:#fbeec0;
  --flag:#b1490f; --flag-bg:#fde3d0; --flag-border:#f3b988;
  --new:#5b3fc7; --new-bg:#ece7fb; --retire:#a4243b; --retire-bg:#fbe3e7;
  --warn:#a5760a; --warn-bg:#fdf3d8; --warn-border:#eed394;
  --info-bg:#eef2fc;
  --shadow: 0 1px 2px rgba(20,22,26,.06), 0 8px 24px -12px rgba(20,22,26,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141a; --surface:#1b1e26; --surface-2:#232733; --border:#333a48;
    --ink:#eceef2; --muted:#9aa0b2; --accent:#7c9bf2; --accent-fg:#0c1220;
    --good:#5cd6a0; --good-bg:#123027; --mod:#e8c862; --mod-bg:#332a10;
    --flag:#f2a06c; --flag-bg:#3a2413; --flag-border:#6b431f;
    --new:#b6a4f2; --new-bg:#2a2340; --retire:#f2879a; --retire-bg:#3a1e24;
    --warn:#e8c25e; --warn-bg:#2e2610; --warn-border:#4a3c14;
    --info-bg:#1b2438;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1b1e26; --surface-2:#232733; --border:#333a48;
  --ink:#eceef2; --muted:#9aa0b2; --accent:#7c9bf2; --accent-fg:#0c1220;
  --good:#5cd6a0; --good-bg:#123027; --mod:#e8c862; --mod-bg:#332a10;
  --flag:#f2a06c; --flag-bg:#3a2413; --flag-border:#6b431f;
  --new:#b6a4f2; --new-bg:#2a2340; --retire:#f2879a; --retire-bg:#3a1e24;
  --warn:#e8c25e; --warn-bg:#2e2610; --warn-border:#4a3c14;
  --info-bg:#1b2438;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,sans-serif;line-height:1.5}
h1,h2,h3,.disp{font-family:'Manrope',system-ui,sans-serif;text-wrap:balance}
button{font-family:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}

.app{min-height:100%;display:flex;flex-direction:column}
.topline{height:4px;background:var(--ink)}

/* portal header, mimicking the real IU AI Media Self Service Portal */
.portalbar{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:9px}
.logo .mark{font-family:'Manrope';font-weight:800;font-size:20px;background:var(--ink);color:var(--surface);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.logo .word{font-size:11px;line-height:1.2;color:var(--muted);font-weight:600}
.beta{font-size:10.5px;font-weight:800;letter-spacing:.03em;background:var(--accent);color:var(--accent-fg);padding:3px 8px;border-radius:5px}
.portalnav{display:flex;gap:22px;flex:1;flex-wrap:wrap}
.portalnav span{font-size:13.5px;color:var(--muted);font-weight:600;padding-bottom:14px;border-bottom:2px solid transparent;margin-bottom:-15px}
.portalnav span.active{color:var(--ink);border-color:var(--ink);font-weight:800}
.railmini{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.railmini b{color:var(--accent)}
.topbtns{display:flex;gap:8px}
.iconbtn{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  cursor:pointer;
}
.iconbtn.on{background:var(--info-bg);border-color:var(--accent);color:var(--accent)}

.stage-wrap{flex:1;display:flex;justify-content:center;padding:28px 16px 48px}
.stage{width:100%;max-width:920px;display:flex;flex-direction:column;gap:16px}
.crumbrow{display:flex;align-items:center;justify-content:space-between;min-height:24px}
.backbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px 2px}
.stepbadge{font-size:11.5px;color:var(--muted);letter-spacing:.03em}

h1.pagetitle{font-size:26px;margin:0;font-weight:800}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:26px}
.card h2{font-size:20px;margin:0 0 6px;font-weight:800}
.lead{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:60ch}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.02em;padding:3px 9px;border-radius:999px}
.pill svg{width:12px;height:12px;flex:none}
.pill.mod{background:var(--mod-bg);color:var(--mod)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.flag{background:var(--flag-bg);color:var(--flag)}
.pill.newtopic{background:var(--new-bg);color:var(--new)}
.pill.retire{background:var(--retire-bg);color:var(--retire)}
.pill.neutral{background:var(--info-bg);color:var(--accent)}

/* course grid */
.searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 14px;color:var(--muted);font-size:13.5px}
.btn{border:none;border-radius:9px;padding:10px 16px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.btn.block{width:100%;justify-content:center}
.btn.sm{padding:7px 12px;font-size:12.5px}

.coursegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:880px){.coursegrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.coursegrid{grid-template-columns:1fr}}
.coursecard{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.coursecard:hover{border-color:var(--accent)}
.cthumb{position:relative;aspect-ratio:16/10;background:linear-gradient(155deg,#4a4f5c,#22242b);display:flex;align-items:flex-end}
.cthumb .code{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.65);color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px}
.cthumb .status{position:absolute;top:9px;right:9px}
.cthumb .flagribbon{position:absolute;top:38px;right:9px}
.cthumb .title{background:rgba(0,0,0,.68);color:#fff;font-weight:800;font-size:13.5px;padding:8px 10px;width:100%}
.cmeta{padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.cmeta b{color:var(--ink)}
.cmeta .flagline{color:var(--flag);font-weight:800;font-size:11.5px;margin-top:2px}

/* course detail */
.detailhead{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.metarow{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.metarow b{color:var(--ink)}
.panelgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:800px){.panelgrid{grid-template-columns:1fr}}
.ppanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ppanel .phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ppanel .ptitle{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:7px}
.ppanel p{margin:0;color:var(--muted);font-size:13px}
.ppanel .btnrow{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}

/* diff */
.diffblock{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.7}
.diffblock del{background:var(--retire-bg);color:var(--retire);text-decoration:line-through;padding:0 2px;border-radius:3px}
.diffblock ins{background:var(--good-bg);color:var(--good);text-decoration:none;padding:0 2px;border-radius:3px;font-weight:700}
.diffblock.compact{padding:8px 10px;font-size:12.5px;line-height:1.55}
.diffblock .difflabel{display:block;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.bulletsuggest{display:flex;flex-direction:column;gap:6px;flex:1}

/* published videos grid */
.playlisthead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.playlisthead .t{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.countbadge{background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:880px){.vgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.vgrid{grid-template-columns:1fr}}
.vcard{background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.vcard.flagged{border-color:var(--flag-border)}
.vcard.flagged.manual{border-color:var(--mod)}
.thumb{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(160deg,#3a4a72,#243352);display:flex;align-items:center;justify-content:center}
.thumb svg{width:40%;height:40%;opacity:.9}
.thumb .dur{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.7);color:#fff;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px}
.thumb .badge{position:absolute;top:8px;left:8px;max-width:calc(100% - 16px)}
.thumb .badge svg{width:12px;height:12px;flex:none}
.matchchip{font-size:11px;color:var(--flag);background:var(--flag-bg);border:1px solid var(--flag-border);border-radius:7px;padding:5px 8px;display:flex;gap:5px}
.matchchip.manual{color:var(--mod);background:var(--mod-bg);border-color:var(--mod)}
.linklike{display:inline-flex;align-items:center;background:none;border:none;color:var(--muted);font-weight:700;font-size:12px;padding:4px 0;justify-content:flex-start;gap:5px;cursor:pointer}
.linklike:hover{color:var(--ink)}
.manualflagform{display:flex;flex-direction:column;gap:6px}
.manualflagform textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.vmeta{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.vmeta b{color:var(--ink);font-weight:700}
.vcard .name{font-weight:800;font-size:13.5px}

.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.note{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn);border-radius:10px;padding:11px 13px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.note.resolved{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.note svg{flex:none;width:15px;height:15px;margin-top:1px}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.choice-grid{grid-template-columns:1fr}}
.choice{text-align:left;background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:7px;position:relative;min-width:0}
.choice:hover{border-color:var(--accent)}
.choice .t{font-weight:800;font-size:14.5px}
.choice .d{color:var(--muted);font-size:12.5px}
.choice .done{position:absolute;top:12px;right:12px;color:var(--good);font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}

/* topic board */
.topicrow{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
.topicrow .ti{flex:1;min-width:0}
.topicrow .tt{font-weight:800;font-size:13.5px}
.topicrow .td{color:var(--muted);font-size:12px}
.topiclist{display:flex;flex-direction:column;gap:10px}

/* unit-video editing mask */
.tabrow{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;position:relative}
.tab.active{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.tab.tabflag::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.panel{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel.flagged{border-color:var(--flag-border)}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panelhead .t{font-weight:800;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.flagchip{border-color:var(--flag-border);background:var(--flag-bg);color:var(--flag);cursor:default}
textarea{width:100%;resize:vertical;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit;line-height:1.5}
.charcount{align-self:flex-end;font-size:11px;color:var(--muted)}
.radiorow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.radiopt{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.radiopt .dot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none}
.radiopt.sel .dot{border-color:var(--accent)}
.radiopt.sel .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.editgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}
@media (max-width:760px){.editgrid{grid-template-columns:1fr}}
.editcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.bulletlist{display:flex;flex-direction:column;gap:8px}
.bullet{position:relative;display:flex;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 30px 9px 11px;font-size:12.5px}
.bullet.flagged{border-color:var(--flag-border);background:var(--flag-bg)}
.bullet.accepted{border-color:var(--good);background:var(--good-bg)}
.bullet button{position:absolute;top:7px;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.dropzone{border:1.5px dashed var(--border);border-radius:10px;flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;cursor:pointer;background:var(--surface)}
.dropzone img{max-width:100%;max-height:110px;border-radius:6px}
.dropzone small{color:var(--muted);font-size:12px}
.footerbar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--border);margin:20px -26px -26px;padding:14px 26px 20px;display:flex;flex-direction:column;gap:10px}
.progressline{height:4px;border-radius:99px;background:var(--border);overflow:hidden}
.progressline i{display:block;height:100%;background:var(--accent);width:38%}
.footerbtns{display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}
.toast{font-size:12px;font-weight:700;color:var(--good);margin-right:auto}

.player{background:#0d1320;border-radius:12px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.player svg{width:60px;height:60px;opacity:.92}
.player .cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:26px 16px 10px;color:#fff;font-size:12.5px}

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.formgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field label .req{color:var(--flag);margin-left:2px}
.field input,.field select{padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13.5px}

.metagrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.metagrid{grid-template-columns:1fr}}
.metapanel{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.metapanel .mhead{font-weight:800;font-size:14px}
.metapanel .vtag{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:800;align-self:flex-start}
.tagrow{display:flex;gap:8px;align-items:center}
.tagrow input{flex:1}
.tagaddbtn{width:34px;height:34px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:16px;cursor:pointer;flex:none}
.tagchips{display:flex;flex-wrap:wrap;gap:8px}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px 8px 5px 11px;font-size:12.5px;font-weight:600}
.tagchip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.tagchip button:hover{color:var(--ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13px}
.switch{width:36px;height:20px;border-radius:999px;background:var(--good);position:relative;flex:none}
.switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;right:2px}

.checklist{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.chk .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.chk.done .dot{background:var(--good-bg);color:var(--good)}
.chk.pending .dot{background:var(--surface);border:1.5px dashed var(--border);color:var(--muted)}
.chk .lbl{font-weight:700;font-size:13.5px}
.chk .sub{font-size:12px;color:var(--muted)}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 4px}
.success .circ{width:52px;height:52px;border-radius:50%;background:var(--good-bg);color:var(--good);display:flex;align-items:center;justify-content:center}

/* flow map overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.overlay[hidden]{display:none}
.mapcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);max-width:920px;width:100%;padding:22px}
.mapcard h3{margin:0 0 4px}
.maplead{color:var(--muted);font-size:13px;margin:0 0 16px}
.lane{margin-bottom:14px}
.lane .lanetitle{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:700}
.laneflow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.node{border:1.5px solid var(--border);background:var(--surface-2);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.node:hover{border-color:var(--accent);color:var(--accent)}
.node.current{background:var(--info-bg);border-color:var(--accent);color:var(--accent)}

<body>

<div class="app">

  <header class="portalbar">
    <div class="logo">
      <span class="mark">iu</span>
      <span class="word">AI Media<br>Self Service Portal</span>

    <nav class="portalnav">
      <span>Home</span>
      <span class="active">Course Content Hub</span>
      <span>Video Services</span>
      <span>Text Services</span>

    <span class="railmini" id="rail"></span>
    <div class="topbtns">
      <button class="iconbtn" id="mapBtn" type="button">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none"><circle cx="4" cy="10" r="2" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="5" r="2" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="15" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 10h6M11 6.5 14.5 5M11 13.5 14.5 15" stroke="currentColor" stroke-width="1.4"/></svg>

    <div class="lane"><div class="lanetitle">Course book</div><div class="laneflow" id="lane-book"></div></div>

    <div class="lane"><div class="lanetitle">Wrap-up</div><div class="laneflow" id="lane-wrap"></div></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var state = {
    screen: "courses",
    history: [],
    videoTab: 1,
    videoStyle: "avatar",
    shortcastFormat: null,

  var COURSE = {

    unitTopic: "Abschreibungen (Depreciation)"
  };

      image: null,

  var BOOK_DIFF = {

  var TOPICS = [
    {name:"Buchungssatz-Grundlagen (Shortcast)", status:"ok", detail:"Topic unchanged in the updated book."},
    {name:"Lineare vs. degressive Abschreibung (Shortcast)", status:"review", detail:"The book changed both example figures — same topic, numbers moved."},
    {name:"Skonto-Berechnung im Zahlungsverkehr (Shortcast)", status:"retire", detail:"This topic no longer appears in the updated book."},
    {name:"Anlagenabgang bei vorzeitigem Verkauf", status:"new", detail:"New section in the book. Looks like a self-contained 3-minute topic."}
  ];

  // Content + metadata drafts for the shortcast currently moving through the flow —
  // one for the existing shortcast being updated, one for a brand-new shortcast.
  var SHORTCAST_UPDATE = {
    title: "Lineare vs. degressive Abschreibung",
    description: VIDEO_DESCRIPTION_DEFAULT,
    tags: ["Unit 2", "Abschreibungen", "Shortcast"],
    intro: "Kurzer Rückblick: Wie verändert sich der jährliche Abschreibungsbetrag bei linearer und degressiver Abschreibung?",
    videoTextOld: "Bei der degressiven Abschreibung sinkt der jährliche Betrag, weil er sich vom Restbuchwert berechnet. Beispiel: Eine Maschine im Wert von 60.000 € wird über 5 Jahre linear abgeschrieben, das ergibt 12.000 € pro Jahr. Degressiv mit 25% startet der Betrag höher und sinkt danach jedes Jahr.",
    videoTextSuggested: "Bei der degressiven Abschreibung sinkt der jährliche Betrag, weil er sich vom Restbuchwert berechnet. Beispiel: Eine Maschine im Wert von 60.000 € wird über 6 Jahre linear abgeschrieben, das ergibt 10.000 € pro Jahr. Degressiv mit 20% startet der Betrag höher und sinkt danach jedes Jahr.",
    videoText: "Bei der degressiven Abschreibung sinkt der jährliche Betrag, weil er sich vom Restbuchwert berechnet. Beispiel: Eine Maschine im Wert von 60.000 € wird über 6 Jahre linear abgeschrieben, das ergibt 10.000 € pro Jahr. Degressiv mit 20% startet der Betrag höher und sinkt danach jedes Jahr.",
    videoTextStatus: "pending",
    bullets: [
      {t:"Lineare Abschreibung: gleichbleibender Jahresbetrag.", flagged:false},
      {t:"Beispiel: 60.000 € über 6 Jahre → 10.000 €/Jahr.", newT:"Beispiel: 60.000 € über 6 Jahre → 10.000 €/Jahr.", oldT:"Beispiel: 60.000 € über 5 Jahre → 12.000 €/Jahr.", flagged:true, status:"pending"},
      {t:"Degressive Abschreibung: startet höher, sinkt dann.", flagged:false}
    ],
    image: null
  };
  var SHORTCAST_NEW = {
    title: "Anlagenabgang bei vorzeitigem Verkauf",
    description: VIDEO_DESCRIPTION_DEFAULT,
    tags: ["Anlagenabgang", "Shortcast"],
    intro: "Was passiert steuerlich, wenn eine Anlage vor Ablauf der Nutzungsdauer verkauft wird?",
    videoText: "Wir zeigen, wie der Restbuchwert ausgebucht und der Verkaufserlös damit verrechnet wird.",
    bullets: [
      "Restbuchwert wird ausgebucht.",
      "Verkaufserlös wird verrechnet.",
      "Gewinn oder Verlust ergibt sich aus der Differenz."
    ],
    image: null
  };
  function currentShortcast(){ return state.shortcastFormat ? SHORTCAST_NEW : SHORTCAST_UPDATE; }
  function activeContentEntity(){ return state.screen === "shortcastsEdit" ? currentShortcast() : VIDEO_TABS[state.videoTab]; }

  function iconPerson(){ return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.6" stroke="white" stroke-width="1.4"/><path d="M4.8 19.2c1.3-3.4 4-5.1 7.2-5.1s5.9 1.7 7.2 5.1" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>'; }
  function iconCheck(){ return '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5 8 14.5 16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function iconFlag(){ return '<svg viewBox="0 0 20 20" width="12" height="12" fill="none"><path d="M5 3v14M5 4h9l-2.4 3L14 10H5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'; }
  function iconPlay(){ return '<svg viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="11" fill-opacity=".18"/><path d="M10 8.3 16 12l-6 3.7Z"/></svg>'; }
  function iconClock(){ return '<svg viewBox="0 0 20 20" width="13" height="13" fill="none"><circle cx="10" cy="10" r="7.3" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v4l2.6 1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'; }
  function iconImage(){ return '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" style="color:var(--muted)"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 15.5 8 11l3.5 3.5L15 11l5 5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="1.4" stroke="currentColor" stroke-width="1.4"/></svg>'; }
  function iconSearch(){ return '<svg viewBox="0 0 20 20" width="14" height="14" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M16 16 12.6 12.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'; }

  function go(screen, opts){
    opts = opts || {};
    syncEditFields();
    if(!opts.silent) state.history.push(state.screen);
    state.screen = screen;
    render();
    var stage = document.getElementById("stage");
    if(stage) stage.scrollIntoView({block:"start"});
  }
  function back(){ var p = state.history.pop(); if(p){ state.screen = p; render(); } }
  function reset(){
    state.screen="courses"; state.history=[]; state.videoTab=1; state.videoStyle="avatar"; state.shortcastFormat=null; state.manualFlagOpen=null;
    VIDEO_TABS[1].flagged=false; VIDEO_TABS[1].flagSource=null; VIDEO_TABS[1].manualReason="";
    VIDEO_TABS[2].flagged=true; VIDEO_TABS[2].flagSource="book";
    VIDEO_TABS[2].videoText = VIDEO_TABS[2].videoTextSuggested;
    VIDEO_TABS[2].videoTextStatus = "pending";
    VIDEO_TABS[2].bullets.forEach(function(b){ if(b.oldT){ b.t = b.newT; b.status = "pending"; b.flagged = true; } });
    VIDEO_TABS[3].flagged=false; VIDEO_TABS[3].flagSource=null; VIDEO_TABS[3].manualReason="";
    SHORTCAST_UPDATE.title = "Lineare vs. degressive Abschreibung";
    SHORTCAST_UPDATE.description = VIDEO_DESCRIPTION_DEFAULT;
    SHORTCAST_UPDATE.tags = ["Unit 2", "Abschreibungen", "Shortcast"];
    SHORTCAST_UPDATE.videoText = SHORTCAST_UPDATE.videoTextSuggested;
    SHORTCAST_UPDATE.videoTextStatus = "pending";
    SHORTCAST_UPDATE.bullets.forEach(function(b){ if(b.oldT){ b.t = b.newT; b.status = "pending"; b.flagged = true; } });
    SHORTCAST_UPDATE.image = null;
    SHORTCAST_NEW.title = "Anlagenabgang bei vorzeitigem Verkauf";
    SHORTCAST_NEW.description = VIDEO_DESCRIPTION_DEFAULT;
    SHORTCAST_NEW.tags = ["Anlagenabgang", "Shortcast"];
    SHORTCAST_NEW.image = null;
    render();
  }

  function syncEditFields(){
    if(state.screen !== "videosEdit" && state.screen !== "shortcastsEdit") return;
    var entity = activeContentEntity();
    var intro = document.getElementById("introText");
    var vtext = document.getElementById("videoText");
    if(intro) entity.intro = intro.value;
    if(vtext) entity.videoText = vtext.value;
  }
  function insertPause(which){
    var el = document.getElementById(which === "text" ? "videoText" : "introText");
    var marker = "[pause] ";
    if(!el){
      // No live textarea (e.g. a pending suggestion is shown as a diff, not an editable field yet).
      // Append the pause marker to the underlying text so it carries through once accepted or modified.
      if(which === "text"){
        var entity = activeContentEntity();
        entity.videoTextSuggested = entity.videoTextSuggested + marker;
        entity.videoText = entity.videoTextSuggested;
        render();
      }
      return;
    }
    var start = el.selectionStart != null ? el.selectionStart : el.value.length;
    var end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
    el.value = el.value.slice(0, start) + marker + el.value.slice(end);
    var pos = start + marker.length;
    el.focus(); el.setSelectionRange(pos, pos);
  }

  var PHASES = [
    {key:"entry", screens:["courses"]},
    {key:"book", screens:["courseDetail","bookDiff"]},
    {key:"videos", screens:["videosList","videosEdit","videosPreview","videosConfirm","videosPublish"]},
    {key:"shortcasts", screens:["shortcastsBoard","shortcastsReview","shortcastsCustom","shortcastsPublish"]},
    {key:"done", screens:["checkpoint","done"]}
  ];
  var PHASE_LABELS = {entry:"Courses",book:"Course book",videos:"Unit video",shortcasts:"Shortcasts",done:"Complete"};
  function renderRail(){
    var idx = PHASES.findIndex(function(p){ return p.screens.indexOf(state.screen) > -1; });
    document.getElementById("rail").innerHTML = idx > -1 ? ("Step <b>"+(idx+1)+"</b> of "+PHASES.length+" · "+PHASE_LABELS[PHASES[idx].key]) : "";
  }

  function crumb(label){
    return '<div class="crumbrow">' +
      (state.history.length ? '<button class="backbtn" data-back>&larr; Back</button>' : '<span></span>') +
      '<span class="stepbadge">'+label+'</span></div>';
  }

  function courseCard(opts){
    return '<button type="button" class="coursecard" '+(opts.clickable?'data-go="'+opts.go+'"':'disabled')+'>' +
      '<div class="cthumb">' +
        '<span class="code">'+opts.code+'</span>' +
        '<span class="status pill '+(opts.status==="Modified"?"mod":"ok")+'">'+opts.status+'</span>' +
        (opts.flagged?'<span class="flagribbon pill flag">'+iconFlag()+' Video review</span>':'') +
        '<span class="title">'+opts.name+'</span>' +
      '</div>' +
      '<div class="cmeta"><span>Last change – '+opts.changed+'</span><span>Course Code: <b>'+opts.code+'</b></span><span>Language: 🇩🇪 DE</span>' +
      (opts.flagged?'<span class="flagline">'+iconFlag()+' 1 unit video &amp; 1 shortcast to check</span>':'') +
      '</div>' +
    '</button>';
  }

  var SCREENS = {

    courses: function(){
      return '<h1 class="pagetitle">My courses</h1>' +
        '<div class="searchrow">' +
          '<div class="searchbox">'+iconSearch()+' Search by Course Name or Course Code</div>' +
          '<button class="btn ghost">Manage User Access</button>' +
        '</div>' +
        '<div class="coursegrid">' +
          courseCard({code:COURSE.code, name:COURSE.name, status:"Modified", changed:"11 Sep 2026", flagged:true, clickable:true, go:"courseDetail"}) +
          courseCard({code:"BBUB02-01", name:"Buchführung und Bilanzierung II", status:"Published", changed:"3 Aug 2026", flagged:false, clickable:false}) +
          courseCard({code:"BWL01-01", name:"BWL I", status:"Published", changed:"3 Aug 2026", flagged:false, clickable:false}) +
          courseCard({code:"BCON01-01", name:"Controlling I", status:"Modified", changed:"14 Sep 2026", flagged:false, clickable:false}) +
          courseCard({code:"BETH01-02", name:"Wirtschaftsethik", status:"Published", changed:"3 Aug 2026", flagged:false, clickable:false}) +
        '</div>';
    },

    courseDetail: function(){
      var flaggedCount = [1,2,3].filter(function(i){ return VIDEO_TABS[i].flagged; }).length;
      return crumb("Course book · 1 of 2") +
        '<div class="detailhead">' +
          '<h1 class="pagetitle">'+COURSE.name+'</h1>' +
          '<div class="metarow"><span>Course Code: <b>'+COURSE.code+'</b></span><span>Language: <b>🇩🇪 DE</b></span><span>Last Published: <b>12 May 2025</b></span><span>Last modified: <b>11 Sep 2026</b></span></div>' +
        '</div>' +
        '<div class="panelgrid">' +
          '<div class="ppanel">' +
            '<div class="phead"><span class="ptitle">📖 Course Book &amp; KFK (v2)</span><span class="pill mod">Modified</span></div>' +
            '<p>Check and edit the text of the course book and related questions such as Exam Questions (KFKs).</p>' +
            '<div class="btnrow">' +
              '<button class="btn primary sm" disabled>Prepare to publish</button>' +
              '<button class="btn ghost sm" data-go="bookDiff">Edit content</button>' +
            '</div>' +
          '</div>' +
          '<div class="ppanel">' +
            '<div class="phead"><span class="ptitle">🎥 Videos</span>'+(flaggedCount>0?('<span class="pill flag">'+iconFlag()+' '+flaggedCount+' to check</span>'):('<span class="pill ok">'+iconCheck()+' Up to date</span>'))+'</div>' +
            '<p>'+(flaggedCount>0?('The book edit and any manual reports have flagged '+flaggedCount+' video'+(flaggedCount>1?'s':'')+' to review before the next publish.'):'No unit videos are currently flagged.')+'</p>' +
            '<div class="btnrow"><button class="btn ghost sm block" data-go="videosList">Access videos</button></div>' +
          '</div>' +
          '<div class="ppanel">' +
            '<div class="phead"><span class="ptitle">⚡ Shortcasts</span><span class="pill flag">'+iconFlag()+' 3 to check</span></div>' +

            '<div class="btnrow"><button class="btn ghost sm block" data-go="shortcastsBoard">Access shortcasts</button></div>' +
          '</div>' +
        '</div>';
    },

    bookDiff: function(){
      return crumb("Course book · 2 of 2") +
        '<div class="card">' +
          '<h2>What changed — '+COURSE.unit+' · '+COURSE.unitTopic+'</h2>' +
          '<p class="lead">This is the edit the detector diffed against every published video and shortcast for this course.</p>' +
          '<div class="diffblock" style="margin-bottom:8px"><b style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Previous</b><br>'+BOOK_DIFF.before+'</div>' +
          '<div class="diffblock"><b style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Updated</b><br>'+BOOK_DIFF.after+'</div>' +
          '<div class="btnrow"><button class="btn primary" data-go="videosList">See affected videos &amp; shortcasts →</button></div>' +
        '</div>';
    },

    videosList: function(){
      var DURATIONS = {1:"4:02", 2:"3:41", 3:"5:16"};
      var cardsHTML = [1,2,3].map(function(i){
        var t = VIDEO_TABS[i];
        var meta = '<div class="vmeta"><span>Created <b>3 Aug 2026</b></span><span>Language <b>DE</b></span></div>';
        var thumbOpen = '<div class="thumb">';
        var thumbClose = '<span class="dur">'+DURATIONS[i]+'</span>'+iconPlay()+'</div>';
        var name = '<div class="name">'+t.unitLabel+' · '+t.title+'</div>';

        if(t.flagged){
          var isManual = t.flagSource === "manual";
          var badgeLabel = isManual ? "Reported for review" : "Needs review";
          var chip = isManual
            ? '<div class="matchchip manual">'+iconPerson()+' Reported: "'+(t.manualReason || "No reason given")+'"</div>'
            : '<div class="matchchip">'+iconFlag()+' Matched: "60.000 € über 6 Jahre" &amp; "degressiv 20%"</div>';
          return '<div class="vcard flagged'+(isManual?' manual':'')+'">' +
              thumbOpen + '<span class="badge pill '+(isManual?'mod':'flag')+'">'+iconFlag()+' '+badgeLabel+'</span>' + thumbClose +
              name + meta + chip +
              '<button class="btn primary sm block" data-go="videosDecide" data-video="'+i+'">Open video</button>' +
            '</div>';
        }

        var formOpen = state.manualFlagOpen === i;
        return '<div class="vcard">' +
            thumbOpen + '<span class="badge pill ok">'+iconCheck()+' Up to date</span>' + thumbClose +
            name + meta +
            (formOpen ? '' : '<button type="button" class="linklike" data-action="openManualFlag" data-video="'+i+'">'+iconFlag()+' Flag for review</button>') +
            (formOpen
              ? '<div class="manualflagform"><textarea id="manualReason'+i+'" rows="2" placeholder="What needs a look? (optional)"></textarea>' +
                '<div class="btnrow"><button class="btn ghost sm" data-action="cancelManualFlag">Cancel</button><button class="btn primary sm" data-action="submitManualFlag" data-video="'+i+'">Submit flag</button></div></div>'
              : '') +
          '</div>';
      }).join('');
      return crumb("Unit video · 1 of 5") +
        '<div class="card">' +
          '<div class="playlisthead"><span class="t">Unit videos <span class="countbadge">3</span></span></div>' +
          '<p class="lead">'+COURSE.name+' — published unit videos.</p>' +
          '<div class="vgrid" style="margin-top:14px">' + cardsHTML + '</div>' +
        '</div>';
    },

    videosDecide: function(){
      return crumb("Unit video · 2 of 5") +
        '<div class="card">' +
          '<h2>What’s flagged on this project?</h2>' +

    if(backEl){ back(); return; }

    var tabEl = e.target.closest("[data-tab]");
    if(tabEl){ syncEditFields(); state.videoTab = Number(tabEl.getAttribute("data-tab")); render(); return; }

    var bulletEl = e.target.closest("[data-bullet]");
    if(bulletEl){ activeContentEntity().bullets.splice(Number(bulletEl.getAttribute("data-bullet")), 1); render(); return; }

    var tagRemoveEl = e.target.closest("[data-tagremove]");
    if(tagRemoveEl){ VIDEO_TABS[state.videoTab].tags.splice(Number(tagRemoveEl.getAttribute("data-tagremove")), 1); render(); return; }

    var stagRemoveEl = e.target.closest("[data-stagremove]");
    if(stagRemoveEl){ currentShortcast().tags.splice(Number(stagRemoveEl.getAttribute("data-stagremove")), 1); render(); return; }

    var bulletAcceptEl = e.target.closest("[data-bulletaccept]");
    if(bulletAcceptEl){
      var baIdx = Number(bulletAcceptEl.getAttribute("data-bulletaccept"));
      var baBullet = activeContentEntity().bullets[baIdx];
      baBullet.t = baBullet.newT;
      baBullet.status = "accepted";
      render();
      return;
    }

    var bulletDeclineEl = e.target.closest("[data-bulletdecline]");
    if(bulletDeclineEl){
      var bdIdx = Number(bulletDeclineEl.getAttribute("data-bulletdecline"));
      var bdBullet = activeContentEntity().bullets[bdIdx];
      bdBullet.t = bdBullet.oldT;
      bdBullet.status = "declined";
      bdBullet.flagged = false;
      render();
      return;
    }

    var styleEl = e.target.closest("[data-style]");
    if(styleEl){ state.videoStyle = styleEl.getAttribute("data-style"); render(); return; }

    var pauseEl = e.target.closest("[data-pause]");
    if(pauseEl){ insertPause(pauseEl.getAttribute("data-pause")); return; }

    var browseEl = e.target.closest("[data-browse], [data-browse-zone]");
    if(browseEl){
      e.preventDefault();
      var zone = e.target.closest(".dropzone");
      var input = zone && zone.querySelector(".fileinput");
      if(input) input.click();
      return;
    }

    var formatEl = e.target.closest("[data-format]");
    if(formatEl){ state.shortcastFormat = formatEl.getAttribute("data-format"); }

    var goEl = e.target.closest("[data-go]");
    if(goEl){
      var goVideo = goEl.getAttribute("data-video");
      if(goVideo !== null){ state.videoTab = Number(goVideo); }
      go(goEl.getAttribute("data-go"));
      return;
    }

    var actEl = e.target.closest("[data-action]");
    if(actEl){
      var act = actEl.getAttribute("data-action");
      if(act === "publishVideo"){
        var publishedTab = VIDEO_TABS[state.videoTab];
        publishedTab.flagged = false; publishedTab.flagSource = null; publishedTab.manualReason = "";
        go("checkpoint");
      }
      else if(act === "publishShortcast"){ go("checkpoint"); }
      else if(act === "save"){
        syncEditFields();
        var toast = document.getElementById("editToast");
        if(toast){ toast.hidden = false; clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(function(){ toast.hidden = true; }, 1600); }
      }
      else if(act === "reset"){ reset(); }
      else if(act === "addTag"){
        var tagInput = document.getElementById("tagInput");
        var val = tagInput && tagInput.value.trim();
        if(val){ VIDEO_TABS[state.videoTab].tags.push(val); }
        render();
      }
      else if(act === "addShortcastTag"){
        var scTagInput = document.getElementById("shortcastTagInput");
        var scVal = scTagInput && scTagInput.value.trim();
        if(scVal){ currentShortcast().tags.push(scVal); }
        render();
      }
      else if(act === "saveShortcastMeta"){
        var scDraft = currentShortcast();
        var titleEl = document.getElementById("shortcastTitle");
        var descEl = document.getElementById("shortcastDescription");
        if(titleEl) scDraft.title = titleEl.value;
        if(descEl) scDraft.description = descEl.value;
        go("shortcastsPublish");
      }
      else if(act === "acceptVideoText"){
        var acceptTab = activeContentEntity();
        acceptTab.videoText = acceptTab.videoTextSuggested;
        acceptTab.videoTextStatus = "accepted";
        render();
      }
      else if(act === "declineVideoText"){
        var declineTab = activeContentEntity();
        declineTab.videoText = declineTab.videoTextOld;
        declineTab.videoTextStatus = "declined";
        render();
      }
      else if(act === "modifyVideoText"){
        activeContentEntity().videoTextStatus = "modified";
        render();
      }
      else if(act === "reviewVideoText"){
        syncEditFields();
        activeContentEntity().videoTextStatus = "pending";
        render();
      }
      else if(act === "openManualFlag"){
        state.manualFlagOpen = Number(actEl.getAttribute("data-video"));
        render();
      }
      else if(act === "cancelManualFlag"){
        state.manualFlagOpen = null;
        render();
      }
      else if(act === "submitManualFlag"){
        var flagVideo = Number(actEl.getAttribute("data-video"));
        var reasonEl = document.getElementById("manualReason"+flagVideo);
        var reasonVal = reasonEl ? reasonEl.value.trim() : "";
        var flaggedTab = VIDEO_TABS[flagVideo];
        flaggedTab.flagged = true;
        flaggedTab.flagSource = "manual";
        flaggedTab.manualReason = reasonVal;
        state.manualFlagOpen = null;
        render();
      }
      return;
    }
  });

  document.addEventListener("change", function(e){
    if(!e.target.classList || !e.target.classList.contains("fileinput")) return;
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){ activeContentEntity().image = ev.target.result; render(); };
    reader.readAsDataURL(file);
  });

  var mapOverlay = document.getElementById("mapOverlay");
  function mapNode(id, label, decision){
    return '<button class="node'+(decision?' decision':'')+(state.screen===id?' current':'')+'" data-mapgo="'+id+'">'+label+'</button>';
  }
  function buildMap(){
    document.getElementById("lane-entry").innerHTML = mapNode("courses","My courses");
    document.getElementById("lane-book").innerHTML = mapNode("courseDetail","Course detail")+'<span class="arrow">→</span>'+mapNode("bookDiff","What changed?");
    document.getElementById("lane-videos").innerHTML =
      mapNode("videosList","Published videos")+'<span class="arrow">→</span>'+mapNode("videosDecide","What’s flagged?",true)+'<span class="arrow">→</span>'+
      mapNode("videosEdit","Review &amp; edit")+'<span class="arrow">→</span>'+mapNode("videosPreview","Preview")+'<span class="arrow">→</span>'+
      mapNode("videosConfirm","Confirm metadata")+'<span class="arrow">→</span>'+mapNode("videosPublish","Publish");
    document.getElementById("lane-shortcasts").innerHTML =
      mapNode("shortcastsBoard","Topic board",true)+'<span class="arrow">→</span>'+mapNode("shortcastsReview","Review changed topic")+'<span class="arrow">→</span>'+
      mapNode("shortcastsCustom","New topic → create")+'<span class="arrow">→</span>'+mapNode("shortcastsPublish","Publish");
    document.getElementById("lane-wrap").innerHTML = mapNode("checkpoint","All clear",true)+'<span class="arrow">→</span>'+mapNode("done","Finished");
  }
  document.getElementById("mapBtn").addEventListener("click", function(){ buildMap(); mapOverlay.hidden = false; });
  document.getElementById("mapClose").addEventListener("click", function(){ mapOverlay.hidden = true; });
  mapOverlay.addEventListener("click", function(e){
    if(e.target === mapOverlay){ mapOverlay.hidden = true; return; }
    var n = e.target.closest("[data-mapgo]");
    if(n){ go(n.getAttribute("data-mapgo")); mapOverlay.hidden = true; }
  });

  render();
})();
</script>
</body>
</html>
